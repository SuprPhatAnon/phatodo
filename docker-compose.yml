name: phatodo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phatodo
      POSTGRES_USER: phatodo
      POSTGRES_PASSWORD: phatodo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phatodo -d phatodo"]
      interval: 10s
      timeout: 5s
      retries: 5

  phatodo-server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHATODO_ADDR: ":8080"
      PHATODO_DATABASE_URL: "postgres://phatodo:phatodo_dev_password@postgres:5432/phatodo?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
