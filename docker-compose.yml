services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trakkr
      POSTGRES_USER: trakkr
      POSTGRES_PASSWORD: trakkr_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trakkr -d trakkr"]
      interval: 10s
      timeout: 5s
      retries: 5

  trakkr-server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRAKKR_ADDR: ":8080"
      TRAKKR_DATABASE_URL: "postgres://trakkr:trakkr_dev_password@postgres:5432/trakkr?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
