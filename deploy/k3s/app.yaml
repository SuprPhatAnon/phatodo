apiVersion: v1
kind: Service
metadata:
  name: phatodo-server
  namespace: phatodo
spec:
  selector:
    app: phatodo-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phatodo-server
  namespace: phatodo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phatodo-server
  template:
    metadata:
      labels:
        app: phatodo-server
    spec:
      initContainers:
        - name: wait-for-database-and-migrations
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PHATODO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phatodo-postgres
                  key: url
          command:
            - sh
            - -ec
            - |
              until pg_isready -d "$PHATODO_DATABASE_URL"; do
                sleep 2
              done
              until psql "$PHATODO_DATABASE_URL" -Atqc "SELECT 1 FROM schema_migrations WHERE version = '0002_task_kind_root_cause'" | grep -qx 1; do
                sleep 2
              done
      containers:
        - name: phatodo-server
          image: localhost:30500/phatodo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PHATODO_ADDR
              value: ":8080"
            - name: PHATODO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phatodo-postgres
                  key: url
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
