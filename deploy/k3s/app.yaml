apiVersion: v1
kind: Service
metadata:
  name: trakkr-server
  namespace: trakkr
spec:
  selector:
    app: trakkr-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakkr-server
  namespace: trakkr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trakkr-server
  template:
    metadata:
      labels:
        app: trakkr-server
    spec:
      containers:
        - name: trakkr-server
          image: ghcr.io/suprphatanon/trakkr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRAKKR_ADDR
              value: ":8080"
            - name: TRAKKR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trakkr-postgres
                  key: url
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
