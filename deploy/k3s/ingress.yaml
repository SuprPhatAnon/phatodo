apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trakkr
  namespace: trakkr
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trakkr.example.com
      secretName: trakkr-tls
  rules:
    - host: trakkr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trakkr-server
                port:
                  name: http
