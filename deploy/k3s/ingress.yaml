apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phatodo
  namespace: phatodo
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - phatodo.example.com
      secretName: phatodo-tls
  rules:
    - host: phatodo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phatodo-server
                port:
                  name: http
